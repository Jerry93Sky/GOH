name: Windows V0.2 Field-Test Build

on:
  push:
    branches: [codex/p1-c-field-test-build]
  pull_request:
    branches: [codex/p1-c-field-test-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-build.txt
      - name: Python syntax check
        run: python -m compileall -q tools
      - name: Automated synthetic and filesystem tests
        run: python -m unittest discover -s tools/tests -v
      - name: Build standalone GUI executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name GOHRecoveryManager --paths tools tools/goh_recovery_manager.py
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath 'dist/GOHRecoveryManager.exe' -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged executable smoke test failed with exit $($process.ExitCode)" }
      - name: Assemble portable distribution
        run: python tools/package_windows.py --dist dist
      - name: Verify ZIP and checksums
        shell: pwsh
        run: |
          $zip = [System.IO.Compression.ZipFile]::OpenRead('dist/GOH-Coop-Recovery-V0.2-FieldTest-win64.zip')
          try {
            $required = @('GOHRecoveryManager.exe','config/default.json','docs/INSTALL_RU.md','docs/FIRST_RUN_RU.md','docs/TEST_A_RU.md','docs/TEST_B_RU.md','docs/TROUBLESHOOTING_RU.md','docs/RECOVERY_METADATA_TEMPLATE_RU.json','docs/P1_C_RESULTS.md','docs/OBSERVATION_RU.md','docs/RECOVERY_WIZARD_RU.md','docs/DIAGNOSTIC_REPORT_TEMPLATE_RU.json','checksums.sha256','VERSION.txt')
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($entry in $required) { if ($entry -notin $names) { throw "Missing archive entry: $entry" } }
          } finally { $zip.Dispose() }
          $expected = (Get-Content 'dist/GOHRecoveryManager.exe.sha256' -Raw).Trim().Split(' ')[0]
          $actual = (Get-FileHash 'dist/GOHRecoveryManager.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Executable checksum mismatch' }
      - uses: actions/upload-artifact@v4
        with:
          name: GOH-Coop-Recovery-V0.2-FieldTest-win64
          path: dist/GOH-Coop-Recovery-V0.2-FieldTest-win64.zip
          if-no-files-found: error
          retention-days: 30
